<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sprite Viewer & Inspector - Anime Rescue</title>
    <style>
        body {
            background-color: #0b071e;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            margin: 0;
        }
        h1 {
            color: #c084fc;
            margin-bottom: 6px;
            font-size: 28px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 640px;
            width: 100%;
        }
        .canvas-container {
            background: #02010a;
            background-image: 
                linear-gradient(45deg, #110d26 25%, transparent 25%), 
                linear-gradient(-45deg, #110d26 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #110d26 75%), 
                linear-gradient(-45deg, transparent 75%, #110d26 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }
        canvas {
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
        }
        button, select, .file-btn {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid #a855f7;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }
        button:hover, select:hover, .file-btn:hover {
            background: #9333ea;
            transform: translateY(-1px);
        }
        select {
            background: #18122b;
            font-family: inherit;
            outline: none;
            width: 100%;
            margin-bottom: 16px;
            font-size: 15px;
        }
        .slider-group {
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        label {
            font-size: 14px;
            color: #94a3b8;
        }
        input[type="range"] {
            flex: 1;
            margin-left: 15px;
            accent-color: #c084fc;
        }
        .status {
            font-size: 20px;
            font-weight: bold;
            color: #ffd13b;
            margin-bottom: 12px;
            font-family: monospace;
        }
        .info {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.5;
            margin-top: 10px;
        }
        .toggle-group {
            display: flex;
            gap: 16px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #c084fc;
        }
        .toggle-group label {
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-section {
            width: 100%;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px dashed rgba(192, 132, 252, 0.4);
            border-radius: 8px;
            padding: 12px;
            background: rgba(168, 85, 247, 0.05);
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <h1>🎮 Sprite Viewer & Inspector</h1>
    <div class="subtitle">Anime Rescue RPG Asset Inspection Tool</div>
    
    <div class="container">
        <!-- Local Upload Section -->
        <div class="upload-section">
            <label for="file-input" class="file-btn">📂 Choose / Drop Custom PNG Crop Files</label>
            <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/webp">
            <span style="font-size: 11px; color: #94a3b8; margin-top: 6px;">Or select a preset animation below:</span>
        </div>

        <!-- Asset Selector Dropdown -->
        <select id="asset-select">
            <option value="giyu-idle" selected>🌊 Giyu Tomioka - Idle Pose (User Cropped 8 Frames)</option>
            <option value="giyu-walking">🌊 Giyu Tomioka - Walk Cycle (User Cropped 8 Frames)</option>
            <option value="giyu-jump">🌊 Giyu Tomioka - Jump Pose (User Cropped 8 Frames)</option>
            <option value="giyu-attack">🌊 Giyu Tomioka - Katana Slash Attack (User Cropped 14 Frames)</option>
            <option value="mt">🗡️ Muichiro Tokito - Walk Cycle (25 frames)</option>
            <option value="mt-attack">🗡️ Muichiro Tokito - Attack Pose (16 frames - Keyed Transparent)</option>
            <option value="chuuya">🍷 Chuuya Nakahara - Walk Cycle (36 frames)</option>
            <option value="yuta">💍 Yuta Okkotsu - Walk Cycle (25 frames)</option>
            <option value="yuta-attack">💍 Yuta Okkotsu - Attack Pose (25 frames)</option>
            <option value="akari-idle">✨ Akari - Idle (13 frames)</option>
            <option value="akari-running">✨ Akari - Running (7 frames)</option>
            <option value="akari-jump">✨ Akari - Jump (5 frames)</option>
            <option value="akari-attack">✨ Akari - Slash Attack (8 frames)</option>
            <option value="akari-hurt">✨ Akari - Hurt Recovery (9 frames)</option>
            <option value="akari-victory">✨ Akari - Heroic Pose (9 frames)</option>
        </select>

        <div class="toggle-group">
            <label><input type="checkbox" id="key-green" checked> Key Out Green Backgrounds (#001200 / #008000)</label>
        </div>

        <div class="status">Frame: <span id="frame-num">000</span> / <span id="frame-total">007</span></div>
        
        <div class="canvas-container" id="drop-zone">
            <canvas id="sprite-canvas" width="400" height="400"></canvas>
        </div>
        
        <div class="controls">
            <button id="btn-prev">◀ Prev</button>
            <button id="btn-play">Pause</button>
            <button id="btn-next">Next ▶</button>
        </div>
        
        <div class="slider-group">
            <label for="speed">Speed (FPS): <span id="fps-label">8</span></label>
            <input type="range" id="speed" min="1" max="30" value="8">
        </div>

        <div class="slider-group">
            <label for="frame-slider">Timeline:</label>
            <input type="range" id="frame-slider" min="0" max="7" value="0">
        </div>
        
        <div class="info">
            Inspecting live frames from <code>public/</code> directory or your uploaded PNG files!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sprite-canvas');
        const ctx = canvas.getContext('2d');
        const frameNumSpan = document.getElementById('frame-num');
        const frameTotalSpan = document.getElementById('frame-total');
        const btnPrev = document.getElementById('btn-prev');
        const btnPlay = document.getElementById('btn-play');
        const btnNext = document.getElementById('btn-next');
        const speedSlider = document.getElementById('speed');
        const fpsLabel = document.getElementById('fps-label');
        const frameSlider = document.getElementById('frame-slider');
        const assetSelect = document.getElementById('asset-select');
        const keyGreenCheckbox = document.getElementById('key-green');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        
        let currentFrame = 0;
        let isPlaying = true;
        let fps = 8;
        let lastTime = 0;
        
        let images = [];
        let totalFrames = 0;

        function createSmartImage(candidatePaths) {
            const img = new Image();
            let candidateIdx = 0;

            function tryNext() {
                if (candidateIdx < candidatePaths.length) {
                    img.src = candidatePaths[candidateIdx++];
                }
            }

            img.onerror = () => {
                tryNext();
            };

            tryNext();
            return img;
        }

        const assetConfigs = {
            "giyu-idle": {
                total: 8,
                getPaths: (i) => [`public/giyu/idle/frame_${String(i).padStart(3, '0')}.png`, `/giyu/idle/frame_${String(i).padStart(3, '0')}.png`]
            },
            "giyu-walking": {
                total: 8,
                getPaths: (i) => [`public/giyu/walking/frame_${String(i).padStart(3, '0')}.png`, `/giyu/walking/frame_${String(i).padStart(3, '0')}.png`]
            },
            "giyu-jump": {
                total: 8,
                getPaths: (i) => [`public/giyu/jump/frame_${String(i).padStart(3, '0')}.png`, `/giyu/jump/frame_${String(i).padStart(3, '0')}.png`]
            },
            "giyu-attack": {
                total: 14,
                getPaths: (i) => [`public/giyu/attack/frame_${String(i).padStart(3, '0')}.png`, `/giyu/attack/frame_${String(i).padStart(3, '0')}.png`]
            },
            "mt": {
                total: 25,
                getPaths: (i) => [`public/muichiro/walking/frame_${String(i).padStart(3, '0')}.png`, `/muichiro/walking/frame_${String(i).padStart(3, '0')}.png`]
            },
            "mt-attack": {
                total: 16,
                getPaths: (i) => [`public/muichiro/attack/frame_${String(i).padStart(3, '0')}.png`, `/muichiro/attack/frame_${String(i).padStart(3, '0')}.png`]
            },
            "chuuya": {
                total: 36,
                getPaths: (i) => [`public/chuuya/walking/frame_${String(i).padStart(3, '0')}.png`, `/chuuya/walking/frame_${String(i).padStart(3, '0')}.png`]
            },
            "yuta": {
                total: 25,
                getPaths: (i) => [`public/yuta/walking/frame_${String(i).padStart(3, '0')}.png`, `/yuta/walking/frame_${String(i).padStart(3, '0')}.png`]
            },
            "yuta-attack": {
                total: 25,
                getPaths: (i) => [`public/yuta/attack/frame_${String(i).padStart(3, '0')}.png`, `/yuta/attack/frame_${String(i).padStart(3, '0')}.png`]
            },
            "luka-walking": {
                total: 8,
                getPaths: (i) => [`public/luka/walking/frame_${String(i).padStart(3, '0')}.png`, `/luka/walking/frame_${String(i).padStart(3, '0')}.png`]
            },
            "luka-attack": {
                total: 8,
                getPaths: (i) => [`public/luka/attack/frame_${String(i).padStart(3, '0')}.png`, `/luka/attack/frame_${String(i).padStart(3, '0')}.png`]
            },
            "akari-idle": {
                total: 13,
                getPaths: (i) => [`public/D Type/idle/${String(i).padStart(3, '0')}.png`, `/D Type/idle/${String(i).padStart(3, '0')}.png`]
            },
            "akari-running": {
                total: 7,
                getPaths: (i) => [`public/D Type/running/${String(i + 148).padStart(3, '0')}.png`, `/D Type/running/${String(i + 148).padStart(3, '0')}.png`]
            },
            "akari-jump": {
                total: 5,
                getPaths: (i) => [`public/D Type/jump/${String(i + 37).padStart(3, '0')}.png`, `/D Type/jump/${String(i + 37).padStart(3, '0')}.png`]
            },
            "akari-attack": {
                total: 8,
                getPaths: (i) => [`public/D Type/slash_attack_1/${String(i + 29).padStart(3, '0')}.png`, `/D Type/slash_attack_1/${String(i + 29).padStart(3, '0')}.png`]
            },
            "akari-hurt": {
                total: 9,
                getPaths: (i) => [`public/D Type/hurt_recovery/${String(i + 139).padStart(3, '0')}.png`, `/D Type/hurt_recovery/${String(i + 139).padStart(3, '0')}.png`]
            },
            "akari-victory": {
                total: 9,
                getPaths: (i) => [`public/D Type/heroic_pose/${String(i + 234).padStart(3, '0')}.png`, `/D Type/heroic_pose/${String(i + 234).padStart(3, '0')}.png`]
            }
        };

        function loadAsset(key) {
            const config = assetConfigs[key];
            if (!config) return;
            totalFrames = config.total;
            images = [];
            
            frameTotalSpan.textContent = String(totalFrames - 1).padStart(3, '0');
            frameSlider.max = totalFrames - 1;
            frameSlider.value = 0;
            currentFrame = 0;

            for (let i = 0; i < totalFrames; i++) {
                const img = createSmartImage(config.getPaths(i));
                images.push(img);
            }
            drawFrame(0);
        }

        function loadCustomFiles(filesList) {
            const fileArray = Array.from(filesList).sort((a, b) => a.name.localeCompare(b.name));
            if (fileArray.length === 0) return;

            totalFrames = fileArray.length;
            images = [];

            frameTotalSpan.textContent = String(totalFrames - 1).padStart(3, '0');
            frameSlider.max = totalFrames - 1;
            frameSlider.value = 0;
            currentFrame = 0;

            fileArray.forEach(file => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                images.push(img);
            });

            drawFrame(0);
        }

        function drawFrame(index) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const img = images[index];
            if (!img) return;

            if (img.complete && img.naturalWidth !== 0) {
                let drawSource = img;
                if (keyGreenCheckbox.checked) {
                    if (!img._keyedCanvas) {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = img.naturalWidth;
                        tempCanvas.height = img.naturalHeight;
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.drawImage(img, 0, 0);
                        const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                        const data = imgData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i], g = data[i+1], b = data[i+2];
                            if (g > 100 && r < 50 && b < 50) {
                                data[i+3] = 0;
                            }
                        }
                        tempCtx.putImageData(imgData, 0, 0);
                        img._keyedCanvas = tempCanvas;
                    }
                    drawSource = img._keyedCanvas;
                }

                const targetSize = 280;
                const ratio = img.width / img.height;
                const w = ratio >= 1 ? targetSize : targetSize * ratio;
                const h = ratio >= 1 ? targetSize / ratio : targetSize;
                
                const x = (canvas.width - w) / 2;
                const y = (canvas.height - h) / 2;
                
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(drawSource, x, y, w, h);
            } else {
                ctx.fillStyle = '#c084fc';
                ctx.font = '16px monospace';
                ctx.fillText(`Loading frame ${String(index).padStart(3, '0')}...`, 60, 200);
            }
            frameNumSpan.textContent = String(index).padStart(3, '0');
            frameSlider.value = index;
        }
        
        function animate(timestamp) {
            if (isPlaying) {
                const interval = 1000 / fps;
                const delta = timestamp - lastTime;
                
                if (delta >= interval) {
                    currentFrame = (currentFrame + 1) % totalFrames;
                    drawFrame(currentFrame);
                    lastTime = timestamp - (delta % interval);
                }
            }
            requestAnimationFrame(animate);
        }
        
        assetSelect.addEventListener('change', (e) => {
            loadAsset(e.target.value);
        });

        keyGreenCheckbox.addEventListener('change', () => {
            images.forEach(img => { if (img) img._keyedCanvas = null; });
            drawFrame(currentFrame);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadCustomFiles(e.target.files);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#c084fc';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(168, 85, 247, 0.4)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(168, 85, 247, 0.4)';
            if (e.dataTransfer.files.length > 0) {
                loadCustomFiles(e.dataTransfer.files);
            }
        });

        btnPlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlay.textContent = isPlaying ? "Pause" : "Play";
        });
        
        btnPrev.addEventListener('click', () => {
            isPlaying = false;
            btnPlay.textContent = "Play";
            currentFrame = (currentFrame - 1 + totalFrames) % totalFrames;
            drawFrame(currentFrame);
        });
        
        btnNext.addEventListener('click', () => {
            isPlaying = false;
            btnPlay.textContent = "Play";
            currentFrame = (currentFrame + 1) % totalFrames;
            drawFrame(currentFrame);
        });
        
        speedSlider.addEventListener('input', (e) => {
            fps = parseInt(e.target.value);
            fpsLabel.textContent = fps;
        });

        frameSlider.addEventListener('input', (e) => {
            isPlaying = false;
            btnPlay.textContent = "Play";
            currentFrame = parseInt(e.target.value);
            drawFrame(currentFrame);
        });
        
        loadAsset("giyu-idle");

        requestAnimationFrame((timestamp) => {
            lastTime = timestamp;
            animate(timestamp);
        });
    </script>
</body>
</html>
